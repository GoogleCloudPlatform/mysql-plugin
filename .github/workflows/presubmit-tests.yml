name: Presubmit Tests

on:
  pull_request:
    branches: [ main ]

jobs:
  run-presubmit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Gemini CLI
        run: npm install @google/gemini-cli

      - name: Install Extension
        run: npx gemini extensions validate .
        env:
          GEMINI_API_KEY: "placeholder"

  oss-exit-gate-release:
    name: Publish GitHub Release via OSS Exit Gate
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Authenticate to Google Cloud (OSS Exit Gate)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Stage release artifacts and upload manifest to OSS Exit Gate
        env:
          TAG_NAME: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          ARCHIVE="mysql-plugin-${VERSION}.tar.gz"
          git archive --format=tar.gz -o "$ARCHIVE" HEAD
          if gcloud artifacts versions describe "${TAG_NAME}" \
            --package="mysql-plugin" \
            --project="oss-exit-gate-prod" \
            --location="us" \
            --repository="mysql-plugin--githubreleases" >/dev/null 2>&1; then
            gcloud artifacts versions delete "${TAG_NAME}" \
              --package="mysql-plugin" \
              --project="oss-exit-gate-prod" \
              --location="us" \
              --repository="mysql-plugin--githubreleases" \
              --quiet
          fi
          gcloud artifacts generic upload \
            --project="oss-exit-gate-prod" \
            --location="us" \
            --repository="mysql-plugin--githubreleases" \
            --package="mysql-plugin" \
            --version="${TAG_NAME}" \
            --source="$ARCHIVE"
          cat <<EOF > manifest.json
          {
            "publish_all": false,
            "publishing_groups": [
              {
                "packages": [
                  {
                    "name": "mysql-plugin",
                    "version": "${TAG_NAME}"
                  }
                ]
              }
            ]
          }
          EOF
          gcloud storage cp manifest.json \
            "gs://oss-exit-gate-prod-projects-bucket/mysql-plugin/githubreleases/manifests/manifest-${TAG_NAME}-${RUN_ID}-${RUN_ATTEMPT}.json"
